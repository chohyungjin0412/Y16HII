name: Build IPA + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Calculate next version
        id: version
        working-directory: "Y16HII ver.Pre 2.swiftpm"
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(grep -oE 'displayVersion: "[0-9]+\.[0-9]+\.[0-9]+"' Package.swift | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)"/\1/')"
          if [ -z "$CURRENT" ]; then
            echo "Could not read displayVersion from Package.swift"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          BUILD="${GITHUB_RUN_NUMBER}"

          # Change only the copy used by this CI build; nothing is committed back.
          sed -i.bak -E "s/displayVersion: \"[0-9]+\.[0-9]+\.[0-9]+\"/displayVersion: \"${VERSION}\"/" Package.swift
          sed -i.bak -E "s/bundleVersion: \"[0-9]+\"/bundleVersion: \"${BUILD}\"/" Package.swift
          rm -f Package.swift.bak

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building Y16HII $VERSION ($BUILD)"
          grep -E 'displayVersion|bundleVersion' Package.swift

      - name: Build Swift Playgrounds App
        working-directory: "Y16HII ver.Pre 2.swiftpm"
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build"
          xcodebuild \
            -scheme "Y16HII" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/build/Build/Products" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app was produced."
            find "$GITHUB_WORKSPACE/build" -maxdepth 5 -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          IPA="Y16HII-${VERSION}.ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Y16HII-${{ steps.version.outputs.version }}-ipa
          path: Y16HII-${{ steps.version.outputs.version }}.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release create "$TAG" "$IPA" \
            --title "Y16HII ${VERSION}" \
            --generate-notes \
            --notes "자동 빌드된 unsigned IPA\n\nVersion: ${VERSION}\nBuild: ${BUILD}\n\nSideStore 등 개인 서명 도구에서 설치하세요."
