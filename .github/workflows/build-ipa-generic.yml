name: Build IPA

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip swiftpm
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.swiftpm.zip" -o -maxdepth 2 -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          PKG=$(find src -name Package.swift -not -path "*/.build/*" | head -n 1)
          echo "PKG_DIR=$(dirname "$PKG")" >> $GITHUB_ENV

      - name: Build (unsigned)
        working-directory: ${{ env.PKG_DIR }}
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('workspace') or d.get('project'))['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find "$PKG_DIR/build/Build/Products" -name "*.app" -type d | head -n 1)
          echo "APP: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
